<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ruNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#FF1E8E" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>
    <linearGradient id="ruSquircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23112B" />
      <stop offset="100%" stop-color="#0B0710" />
    </linearGradient>
    <filter id="ruNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#ruSquircleBg)" stroke="#FF1E8E" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Monogram R & Piano Key-Stroke Badge -->
  <g filter="url(#ruNeonGlow)" fill="none" stroke="url(#ruNeonGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Circular Neon Ring -->
    <circle cx="50" cy="50" r="35" stroke-opacity="0.95" />

    <!-- Left Framed Stem: 2 hollow white piano keys with notched top black key -->
    <!-- Outer rectangle frame for piano keys -->
    <rect x="27" y="27" width="19" height="46" rx="2" stroke-width="2.8" />
    <!-- Vertical dividing line between the two white keys -->
    <line x1="36.5" y1="46" x2="36.5" y2="73" stroke-width="2.2" />
    <!-- Notched single hollow black key between the two keys at the top -->
    <rect x="33" y="27" width="7" height="19" rx="1.5" stroke-width="2.2" />

    <!-- Right Side: sweeps from the stem into the curved bowl and leg of letter 'R' -->
    <!-- Upper Bowl of 'R' -->
    <path d="M 46 27 L 54 27 C 64 27 69 33 69 40 C 69 47 63 52 52 52 L 46 52" stroke-width="2.8" />
    <!-- Diagonal Leg of 'R' -->
    <path d="M 52 52 C 58 52 62 60 67 73" stroke-width="2.8" />
  </g>
</svg>
